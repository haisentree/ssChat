<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssChat - 简单安全的Web聊天</title>
    <link rel="stylesheet" href="/web/css/home.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/8.0.20/jsrsasign-all-min.js"></script>
    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
          }
        }
    </script>
    <script type="module">
        import { createApp, ref ,onMounted } from 'vue'

        createApp({
            setup() {
                const message = ref('Hello Vue!')
                // 默认值为广播群组
                const communicateClinet = ref('0000000000')
                const messageClient = ref('none')
                const currentClient = ref('none')

                var conn;
                var sendMessage

                var rsaKeypair = KEYUTIL.generateKeypair("RSA", 1024);
                var pubKey = KEYUTIL.getPEM(rsaKeypair.pubKeyObj);
                var prvKey = KEYUTIL.getPEM(rsaKeypair.prvKeyObj,'PKCS8PRV');

                // 创建一个变量，存储消息

                // 存储密钥对
                const clientToPubkey = new Map()
                // 按会话存储聊天记录：key为对方UUID（广播频道固定为0000000000）
                // 切换会话时从记录中恢复，不再清空（仍是前端内存存储，刷新页面后消失）
                const clientToMessage = new Map()
                clientToMessage.set('0000000000', [])

                // 生成一条消息气泡（sender同时作为title，点击可选中该客户端）
                function makeBubble(sender, text, cls) {
                    var item = document.createElement("div");
                    item.className = cls
                    item.setAttribute("title",sender)
                    item.addEventListener("click" ,function(event){
                        messageClient.value = event.target.title
                    })
                    item.innerText = text;
                    return item
                }

                // 追加气泡到消息窗口（带自动滚动，与appendLog逻辑一致）
                function appendBubble(item) {
                    var f = document.getElementById("log")
                    var doScroll = f.scrollTop > f.scrollHeight - f.clientHeight - 1;
                    f.appendChild(item);
                    if (doScroll) {
                        f.scrollTop = f.scrollHeight - f.clientHeight;
                    }
                }

                // 消息写入对应会话的记录；若该会话正是当前打开的，同时实时显示到窗口
                function pushMessage(convId, sender, text, cls) {
                    if (!clientToMessage.has(convId)) {
                        clientToMessage.set(convId, [])
                    }
                    clientToMessage.get(convId).push({sender: sender, text: text, cls: cls})
                    if (convId === communicateClinet.value) {
                        appendBubble(makeBubble(sender, text, cls))
                    }
                }

                // 切换会话时，从记录中恢复该会话的聊天记录
                function renderConversation(convId) {
                    var f = document.getElementById("log")
                    f.innerHTML = ""
                    var msgs = clientToMessage.get(convId) || []
                    for (var i = 0; i < msgs.length; i++) {
                        appendBubble(makeBubble(msgs[i].sender, msgs[i].text, msgs[i].cls))
                    }
                }

                function ShowCommunicateClient(event){
                    console.log(event.target.textContent)
                    if(communicateClinet.value != event.target.textContent){
                        // 切换会话：从存储恢复目标会话的聊天记录（不清空）
                        renderConversation(event.target.textContent)
                    }
                    communicateClinet.value = event.target.textContent
                }

                function ShowMessageClient(event){
                    console.log(event.target.value)
                }

                function ConnectMessageReq(event) {
                    document.getElementById('ConnectButton').disabled = true;
                    sendMessage = {
                        type:1,
                        message:"WebSocket连接请求",
                        data:{
                            "pubkey":"123",
                        }
                    }
                    sendMessage.data.pubkey = pubKey
                    sendMessage = JSON.stringify(sendMessage)
                   // sendMessage.data.pubkey = mypubkey
                    // console.log(sendMessage)
                    conn.send(sendMessage)
                }

                function SendGroupMessage(msg) {
                    sendMessage = {
                        type:3,
                        message:"广播消息",
                        data:{
                            send_uuid:"123",
                            content:"msg"
                        }
                    }
                    sendMessage.data.send_uuid = currentClient.value
                    sendMessage.data.content = msg
                    sendMessage = JSON.stringify(sendMessage)
                    conn.send(sendMessage)
                   // console.log("type 3",sendMessage)
                }

                function ConnectClientReq(){
                    sendMessage = {
                        "type": 5,
                        "message": "获取公钥请求",
                        "data": {
                            "add_client": "123"
                        }
                    }
                    sendMessage.data.add_client = messageClient.value
                    sendMessage = JSON.stringify(sendMessage)
                    conn.send(sendMessage)
                }

                function SendSingleMessage(msg) {
                    sendMessage = {
                        "type": 7,
                        "message": "发送点对点加密消息",
                        "data": {
                            "send_uuid": "123",
                            "recv_uuid": "123",
                            "content": "123"
                        }
                    }
                    sendMessage.data.send_uuid = currentClient.value
                    sendMessage.data.recv_uuid = communicateClinet.value
                    var recv_pubkey = clientToPubkey.get(communicateClinet.value)
                    var pub = KEYUTIL.getKey(recv_pubkey)
                    console.log("pub:",pub)
                    var enc2 = KJUR.crypto.Cipher.encrypt(msg,pub)
                    sendMessage.data.content = enc2
                    sendMessage = JSON.stringify(sendMessage)
                    console.log("加密消息：",sendMessage)
                    conn.send(sendMessage)

                }


                onMounted(() => {
                    console.log(`the component is now mounted.`)

                    var msg = document.getElementById("msg");
                    var log = document.getElementById("log");
                    var client_list = document.getElementById("clientList")

                    function AddMessageClient(){
                        // 如果通讯客户端是在自己，无法添加
                        if(currentClient.value == messageClient.value){
                            alert("无法添加自己")
                            return false
                        }
                        if(messageClient.value == 'none'){
                            alert("没有选中该消息客户端")
                            return false
                        }
                        // 发送消息，向WSS获取添加客户端的公钥
                        ConnectClientReq()

                        // 不管是否请求到了公钥，先添加客户端到前端列表中，发送消息的时候再检测
                        // var item = document.createElement("li");
                        // item.id = "message"
                        // item.addEventListener("click" ,ShowCommunicateClient)
                        // item.innerText = messageClient.value;
                        // client_list.appendChild(item)
                    }

                    function appendLog(item) {
                        var doScroll = log.scrollTop > log.scrollHeight - log.clientHeight - 1;
                        log.appendChild(item);
                        if (doScroll) {
                            log.scrollTop = log.scrollHeight - log.clientHeight;
                        }
                    }
                    // 给“添加客户端”按钮增加一个点击事件
                    document.getElementById("AddClient").onclick = AddMessageClient

                    // 点击触发发送消息
                    document.getElementById("form").onsubmit = function () {
                        if (!conn) {
                            return false;
                        }
                        if (!msg.value) {
                            return false;
                        }
                        if (currentClient.value.length != 10) {
                            alert("请先注册客户端，点击连接按钮")
                            return false
                        }
                        if (communicateClinet.value === '0000000000'){
                            SendGroupMessage(msg.value)
                            // console.log("SendGroupMessage")
                            msg.value = "";
                            return false
                        }
                        // 如果是点对点消息，需要加密
                        SendSingleMessage(msg.value)
                        // 将该消息写入当前会话的记录并显示
                        var messages = msg.value.split('\n');
                        for (var i = 0; i < messages.length; i++) {
                            pushMessage(communicateClinet.value, currentClient.value, messages[i], "msg own")
                        }
                        msg.value = "";
                        return false;
                    };

                    if (window["WebSocket"]) {
                        conn = new WebSocket("ws://" + document.location.host + "/ws");

                        conn.onclose = function (evt) {
                            var item = document.createElement("div");
                            item.className = "sys"
                            item.innerHTML = "<b>Connection closed.</b>";
                            appendLog(item);
                        };
                        conn.onmessage = function (evt) {
                            // 对消息进行解析
                            console.log(evt.data)
                            var res = JSON.parse(evt.data.toString())
                            console.log(res["type"])
                            if (res["type"] == 2) {
                                currentClient.value = res["data"]["uuid"]
                            }

                            if (res["type"] == 4) {
                                // 广播消息存入广播频道的会话记录（自己发出的回显在右侧，别人的在左侧）
                                var cls = res["data"]["send_uuid"] === currentClient.value ? "msg own" : "msg other"
                                var messages = res["data"]["content"].split('\n');
                                for (var i = 0; i < messages.length; i++) {
                                    pushMessage('0000000000', res["data"]["send_uuid"], messages[i], cls)
                                }
                            }

                            if (res["type"] == 6) {
                               // clientToPubkey[res["data"]["add_client"].toString()] = res["data"]["pubkey"]
                                clientToPubkey.set(res["data"]["add_client"],res["data"]["pubkey"])


                                // if(clientToMessage.hasOwnProperty(res["data"]["add_client"]) == false){
                                //         // 添加节点
                                //         var item = document.createElement("li");
                                //         item.id = "message"
                                //         item.addEventListener("click" ,ShowCommunicateClient)
                                //         item.innerText = res["data"]["add_client"];
                                //         client_list.appendChild(item)
                                // }

                                var item = document.createElement("li");
                                item.id = "message"
                                item.addEventListener("click" ,ShowCommunicateClient)
                                item.innerText = res["data"]["add_client"];
                                client_list.appendChild(item)

                            }
                            if (res["type"] == 7) {
                                var prv = KEYUTIL.getKey(prvKey);
                                var dec_msg = KJUR.crypto.Cipher.decrypt(res["data"]["content"],prv);
                                console.log("解密内容:",dec_msg)
                                // 收到的点对点消息以发送者为会话key存入记录（在其他会话时收到也不丢，切过来即可见）
                                var messages = dec_msg.split('\n')
                                for (var i = 0; i < messages.length; i++) {
                                    pushMessage(res["data"]["send_uuid"], res["data"]["send_uuid"], messages[i], "msg other")
                                }
                            }



                            // 输出完整未解析的消息
                            // var messages = evt.data.split('\n');
                            // for (var i = 0; i < messages.length; i++) {
                            //     var item = document.createElement("div");
                            //     item.id = "message"
                            //     // 获取value失败，改成获取value
                            //     // item.setAttribute("value","123456")
                            //     item.setAttribute("title","123456")
                            //     // item.setAttribute("onclick","ShowMessageClient")
                            //     item.addEventListener("click" ,function(event){
                            //         // console.log(event.target.title)
                            //         messageClient.value = event.target.title
                            //     })
                            //
                            //     item.innerText = messages[i];
                            //     appendLog(item);
                            // }
                        };
                    } else {
                        var item = document.createElement("div");
                        item.className = "sys"
                        item.innerHTML = "<b>Your browser does not support WebSockets.</b>";
                        appendLog(item);
                    }
                })

                return {
                    message,
                    communicateClinet,
                    messageClient,
                    currentClient,
                    ShowCommunicateClient,
                    ShowMessageClient,
                    ConnectMessageReq
                }
            }
        }).mount('#app')

    </script>

</head>
<body>
    <div class="ChatBox" id="app">
        <div class="BoxHead">
            <div class="Brand">
                <span class="BrandDot"></span>
                <span>ssChat</span>
                <span class="BrandTag">简单 · 安全</span>
            </div>
            <div class="StatusChips">
                <span class="chip">通讯客户端<b>{{communicateClinet}}</b></span>
                <span class="chip">当前客户端<b>{{currentClient}}</b></span>
                <span class="chip">消息客户端<b>{{messageClient}}</b></span>
            </div>
            <div class="Actions">
                <button class="btn btn-primary" @click="ConnectMessageReq" id="ConnectButton">连接</button>
                <button class="btn btn-ghost" id="AddClient">添加客户端</button>
            </div>
        </div>
        <div class="BoxContent">
            <aside class="ContentLeft">
                <div class="SideTitle">广播频道 / 联系人</div>
                <ul class="LeftList" id="clientList">
                    <li @click="ShowCommunicateClient">0000000000</li>
                </ul>
            </aside>
            <main class="ContentRight">
                <div id="log"></div>
                <form id="form">
                    <input type="text" id="msg" placeholder="输入消息，回车发送（点击消息可添加对方为联系人）" autofocus />
                    <input type="submit" value="发送" />
                </form>
            </main>
        </div>
    </div>

</body>
</html>
